<h1>ClipBot</h1>
<p>ClipBot is a personal tool that turns Twitch clips into vertical short videos, with captions and credit to the streamer, and posts them to its owner's own YouTube and Instagram accounts.</p>
<p>It is used only by its owner. It has no public sign-up and no other users.</p>
